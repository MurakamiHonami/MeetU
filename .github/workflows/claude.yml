name: Claude

# issue が open された時点で自動着手し、dev 向けに PR を出す。
# issue / PR のコメントで @claude と書いた時にも反応する。
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # issue の open は無条件で着手する。コメント経由は @claude が要る。
    # bot 起因のイベントには反応しない（dependabot の issue や自分のコメントで
    # 無限に走らせないため）。ただし claude-scan.yml が立てた issue だけは
    # bot 作成でも着手する（auto-scan ラベルで判別。スキャン自身は issue を
    # 作るだけでコメントしないので、ここから無限ループにはならない）。
    if: |
      (
        github.event.sender.type != 'Bot' ||
        (github.event_name == 'issues' &&
         contains(github.event.issue.labels.*.name, 'auto-scan'))
      ) && (
        github.event_name == 'issues' ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # ブランチを作って push する
      pull-requests: write # PR を作る
      issues: write # issue にコメントする
      id-token: write
      actions: read # CI の結果を読む
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: extractions/setup-just@v4

      # CI と同じ入れ方。`just setup` ではなく setup-node が張った
      # tarball キャッシュを使い、audit/funding の往復を省く。
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - uses: anthropics/claude-code-action@v1
        # action は Claude の実行環境に GH_TOKEN を渡さないので、`gh pr create` /
        # `gh issue comment` を使わせるためにここで入れる。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # ブランチは dev から切る。pr-target.yml が base=dev 以外の PR を
          # 自動クローズするため、ここを外すと PR が即閉じられる。
          base_branch: dev
          additional_permissions: |
            actions: read
          prompt: |
            対象は ${{ github.repository }} の
            #${{ github.event.issue.number || github.event.pull_request.number }} です。
            内容は `gh issue view ${{ github.event.issue.number || github.event.pull_request.number }} --comments`
            で読めます。この issue / コメントの内容に対応してください。

            守ること:
            - リポジトリ規約は AGENTS.md に書いてある。必ず読んでから着手する
            - 作業ブランチは dev から切り、PR の base は必ず `dev`（main へは出さない）
            - コミット前に `just ci` を通す
            - 変更は issue で求められた範囲に留める

            コード変更を伴う issue では、調べて終わりにせず必ず最後まで実行すること:
            1. `git checkout -b <branch> dev` で dev から作業ブランチを切る
            2. 変更を入れて `just ci` を通す
            3. `git commit` して `git push -u origin <branch>`
            4. `gh pr create --base dev` で PR を出す
            5. 出した PR の URL を
               `gh issue comment ${{ github.event.issue.number || github.event.pull_request.number }} --body "..."`
               で報告する

            issue の内容がコード変更を伴わない場合（質問・議論・報告のみ）は、
            PR を作らず `gh issue comment` で回答するだけに留めてください。
            いずれの場合も必ず issue にコメントを残すこと（無言で終了しない）。
          # `prompt` を渡すと action は agent mode になり、トラッキングコメントを
          # 作らない（modes/agent/index.ts の claudeCommentId: undefined）。
          # そのため mcp__github_comment__update_claude_comment は
          # CLAUDE_COMMENT_ID 未設定で必ず失敗する。issue へのコメントは
          # Bash の `gh issue comment` で書かせること。
          # CI 系ツールは agent mode でも allowedTools に明示した分だけ
          # MCP サーバーが入る（mcp/install-mcp-server.ts）ので列挙しておく。
          # just/npm/git/gh だけ許可すると、ls や mkdir、docker が permission
          # denied になり、issue 着手が 1 ターンで落ちる。
          claude_args: |
            --allowedTools "Bash,Read,Edit,Write,Grep,Glob,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"
