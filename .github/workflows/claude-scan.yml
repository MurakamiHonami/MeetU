name: Claude Scan

# 3 時間ごとに専用スキャン 4 種類を全部走らせる。
# libraries だけ proposal（自動 PR しない）。他は auto-scan を claude.yml が拾う。
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      scan_type:
        description: '回すスキャン。all は 4 種類まとめて'
        type: choice
        options: [all, security, optimization, dx, libraries]
        default: all
      dry_run:
        description: 'issue を作らず、見つけた内容をログに出すだけ'
        type: boolean
        default: false

concurrency:
  group: claude-scan-${{ github.event.inputs.scan_type || 'all' }}
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          set -euo pipefail
          requested="${{ github.event.inputs.scan_type || 'all' }}"
          if [ "$requested" = "all" ]; then
            echo 'matrix=["security","optimization","dx","libraries"]' >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[\"${requested}\"]" >> "$GITHUB_OUTPUT"
          fi

  scan:
    needs: pick
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scan_type: ${{ fromJSON(needs.pick.outputs.matrix) }}
    permissions:
      contents: read
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: extractions/setup-just@v4

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SCAN_TYPE: ${{ matrix.scan_type }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            対象は ${{ github.repository }}。スキャン種別は ${{ matrix.scan_type }}。
            環境変数 DRY_RUN は "${{ github.event.inputs.dry_run || 'false' }}"。

            次の 2 ファイルを Read し、そこに書いてある指示だけに従え。
            書いてない種類の問題は、見つかっても今は出さない。

            - `.github/claude-scans/shared.md`
            - `.github/claude-scans/${{ matrix.scan_type }}.md`

            最後に、作った issue の番号と URL を一覧する。
            0 件なら、何を調べてなぜ出さなかったかを出力する。無言で終了しない。
          claude_args: |
            --allowedTools "Bash,Read,Grep,Glob,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"
