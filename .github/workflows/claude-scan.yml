name: Claude Scan

# 定期的にリポジトリを調べ、実在する問題だけを issue にする。
# 立てた issue は claude.yml が拾って自動で PR まで出す。
on:
  schedule:
    # 毎日 12:00 JST (03:00 UTC) と 00:00 JST (15:00 UTC)
    - cron: '0 3 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'issue を作らず、見つけた内容をログに出すだけ'
        type: boolean
        default: false

concurrency:
  group: claude-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # スキャンするだけ。ブランチは作らない
      issues: write # 見つけた問題を issue にする
      id-token: write
      actions: read # ワークフローのログから警告を拾う
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: extractions/setup-just@v4

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            ${{ github.repository }} を調べて、実在する問題だけを issue にしてください。

            ## 最優先の原則

            **確認できていないことは書かない。問題が見つからなければ何も作らない。**

            issue を作ることがゴールではありません。0 件で終わるのは正常な結果であり、
            望ましい結果ですらあります。「せっかく走ったから何か出そう」と考えて、
            確認していない推測や、些細で誰も困っていないことを issue にしないでください。
            水増しは、本当に対応が必要な issue を埋もれさせるので有害です。

            ## 調べる対象

            1. CI / GitHub Actions の警告・非推奨・失敗
               - `gh run list --limit 20` と `gh run view <id> --log` で実際のログを読む
               - deprecation warning や繰り返し失敗しているジョブを拾う
            2. 依存関係
               - `npm outdated`、`npm audit` の実際の出力
               - どこからも import されていない依存（grep で裏を取る）
            3. テストカバレッジ
               - `just ci` などで実際にカバレッジレポートを出し、低い箇所を拾う
            4. コード中の TODO / FIXME
               - `grep -rn "TODO\|FIXME" --include=... ` で実際に存在するものだけ

            ## 事実確認の手順（必須）

            issue にする前に、1 件ずつ次を満たすこと。満たせないものは捨てる。

            - コマンドを実際に実行し、その出力を自分の目で見た。「たぶんそうだろう」で書かない
            - 根拠として、実行したコマンドと出力の該当部分を issue 本文に引用できる
            - ファイルパスや行番号を書く場合、そのファイルを Read して実在を確認した
            - 既に直っていないか確認した（過去のログではなく最新の状態を見る）

            エラーで情報が取れなかった項目は、推測で埋めずに落としてください。

            ## 重複の確認（必須）

            このスキャンは 1 日 2 回走ります。前回までに立てた issue をそのまま
            作り直すと、同じ内容が延々と積み上がります。ここが最も事故りやすい
            ので、issue を作る前に必ず:

            - `gh issue list --state all --label auto-scan --limit 50` で
              過去にこのスキャンが立てた issue を確認する
            - 加えて `gh issue list --state all --search "<キーワード>"` でも探す
            - **同じ問題を指す issue が open なら作らない**（再掲もコメントも不要）
            - **closed でも、既に修正済みなら作らない**。closed の理由を確認し、
              「対応済み」なら再提出しない
            - 対応された形跡がないまま closed されたものは、人間が意図的に
              見送った可能性が高い。作り直さない

            言い回しが違うだけの同じ問題も重複です。タイトルの一致ではなく、
            指している事象が同じかどうかで判断してください。

            ## issue の作り方

            上の確認を通ったものだけ、1 件につき 1 つの issue を
            `gh issue create --label auto-scan --title "..." --body "..."` で作成します。

            - 本文には「症状」「根拠（実行したコマンドと出力）」「期待する対応」を書く
            - 根拠のない issue は作らない
            - 1 回のスキャンで作る issue は最大 6 件。それ以上見つかった場合は
              影響の大きい順に 6 件までとし、残りは次回以降に回す
            - 取り消しの効かない操作（ブランチやタグの削除、force push、リリースの削除、
              本番設定の変更）を求める issue は作らない。claude.yml がそれを自動で
              実行してしまうため。報告や提案に留める内容であれば作ってよい
            - `.github/workflows/` 配下の変更を求める issue は作らない。
              GITHUB_TOKEN では workflow ファイルを含む push が GitHub 側で
              拒否される（`refusing to allow a GitHub App to create or update
              workflow ... without` workflows `permission`）ため、claude.yml が
              着手しても必ず push で失敗する。CI の非推奨警告などをここで
              見つけた場合は、issue にせず「最後に必ず行うこと」の出力に含める

            環境変数 DRY_RUN が "true" の場合は、issue を一切作らず、
            作るはずだった内容をそのまま出力して終了してください。

            ## 最後に必ず行うこと

            作業の締めとして、必ず次のどちらかを実行してください。無言で終了しないこと。

            - issue を作った場合: 作成した issue の番号と URL を一覧で出力する
            - 0 件だった場合: 何を調べて、なぜ issue にしなかったのかを出力する
              （この場合も issue は作らない。「特に問題は見つかりませんでした」で構わない）
          claude_args: |
            --allowedTools "Bash,Read,Grep,Glob,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"
