name: Claude CI Fix

# Claude 以外のワークフローが失敗したら、ログを読んで直せるものは PR にする。
# 対象は CI / Deploy Staging / Deploy Production。
# Claude・Claude Scan・このワークフロー自身は見ない（修正ループになるため）。
# 元 run の actor が User のときだけ動かす（claude[bot] の PR が CI で落ちても追撃しない）。
on:
  workflow_run:
    workflows:
      - CI
      - Deploy Staging
      - Deploy Production
    types: [completed]

concurrency:
  group: claude-ci-fix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  fix:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.actor.type == 'User'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: extractions/setup-just@v4

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Record time before Claude runs
        id: before_claude
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED_REPO: ${{ github.repository }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
          FAILED_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          FAILED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: dev
          additional_permissions: |
            actions: read
          prompt: |
            ${{ github.repository }} のワークフローが失敗しました。
            `.github/claude-scans/ci-failure.md` を Read して、その指示に従え。

            - 失敗した run: ${{ github.event.workflow_run.html_url }}
            - workflow 名: ${{ github.event.workflow_run.name }}
            - head branch: ${{ github.event.workflow_run.head_branch }}
            - head SHA: ${{ github.event.workflow_run.head_sha }}
            - actor: ${{ github.event.workflow_run.actor.login }}
          claude_args: |
            --allowedTools "Bash,Read,Edit,Write,Grep,Glob,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"

      - name: Guarantee a response on the failed run's PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ github.event.workflow_run.head_sha }}"
          since="${{ steps.before_claude.outputs.time }}"
          pr=$(gh pr list --repo "${{ github.repository }}" --state open --search "$sha" --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "No open PR for $sha; skip fallback comment"
            exit 0
          fi
          if [ -n "$since" ]; then
            count=$(gh api "repos/${{ github.repository }}/issues/${pr}/comments?since=${since}&per_page=100" \
              --jq "[.[] | select(.user.login == \"claude[bot]\")] | length")
          else
            count=0
          fi
          if [ "$count" -eq 0 ]; then
            run_url="${{ github.event.workflow_run.html_url }}"
            gh pr comment "$pr" --repo "${{ github.repository }}" \
              --body "⚠️ CI 失敗の自動調査がコメントを残さずに終了しました。元の失敗: ${run_url} / このジョブ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
