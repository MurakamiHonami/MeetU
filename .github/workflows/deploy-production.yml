name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: extractions/setup-just@v2

      - name: Install dependencies
        run: just setup

      - name: CI checks
        run: just ci

  release:
    needs: verify
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: e3800962ed5e416e565f49c823868cf3
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_API_BASE_URL: https://api.meetu.ruxel.net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: extractions/setup-just@v2

      - name: Install dependencies
        run: just setup

      - name: Release to production
        run: just release-production
