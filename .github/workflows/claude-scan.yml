name: Claude Scan

# 3 時間ごとに専用スキャンを 1 種類ずつ回す。
# 同じ時刻に 4 本並列だと課金が膨らむのでローテーションする。
#   0,12 UTC  → security
#   3,15 UTC  → optimization
#   6,18 UTC  → dx
#   9,21 UTC  → libraries（proposal のみ。自動 PR しない）
# 立てた auto-scan issue は claude.yml が拾って PR にする。
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      scan_type:
        description: '回すスキャン。rotate は時刻どおり'
        type: choice
        options: [rotate, security, optimization, dx, libraries]
        default: rotate
      dry_run:
        description: 'issue を作らず、見つけた内容をログに出すだけ'
        type: boolean
        default: false

concurrency:
  group: claude-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: extractions/setup-just@v4

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Pick scan type
        id: pick
        run: |
          set -euo pipefail
          requested="${{ github.event.inputs.scan_type || 'rotate' }}"
          if [ "$requested" != "rotate" ]; then
            echo "type=$requested" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(date -u +%H)
          idx=$((10#$hour / 3 % 4))
          types=(security optimization dx libraries)
          echo "type=${types[$idx]}" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SCAN_TYPE: ${{ steps.pick.outputs.type }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            対象は ${{ github.repository }}。スキャン種別は ${{ steps.pick.outputs.type }}。
            環境変数 DRY_RUN は "${{ github.event.inputs.dry_run || 'false' }}"。

            次の 2 ファイルを Read し、そこに書いてある指示だけに従え。
            書いてない種類の問題は、見つかっても今は出さない。

            - `.github/claude-scans/shared.md`
            - `.github/claude-scans/${{ steps.pick.outputs.type }}.md`

            最後に、作った issue の番号と URL を一覧する。
            0 件なら、何を調べてなぜ出さなかったかを出力する。無言で終了しない。
          claude_args: |
            --allowedTools "Bash,Read,Grep,Glob,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"
