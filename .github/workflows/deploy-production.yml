name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: e3800962ed5e416e565f49c823868cf3
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      VITE_API_BASE_URL: https://api.meetu.ruxel.net
    steps:
      - uses: actions/checkout@v4

      - name: Normalize Cloudflare credentials
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          TOKEN=$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s/^[Bb]earer //')

          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty. Set it in Repository secrets (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ -z "$JWT_SECRET" ]; then
            echo "::error::JWT_SECRET is empty. Set it in Repository secrets."
            exit 1
          fi

          echo "CLOUDFLARE_API_TOKEN length: ${#TOKEN} (compare with local: echo -n \"\$TOKEN\" | wc -c)"
          {
            echo "CLOUDFLARE_API_TOKEN<<EOF"
            echo "$TOKEN"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - uses: extractions/setup-just@v2

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Verify Wrangler account access
        working-directory: backend
        run: npx wrangler whoami

      - name: Sync JWT secret to Worker
        working-directory: backend
        run: printf '%s' "$JWT_SECRET" | npx wrangler secret put JWT_SECRET --env production

      - name: Release to production
        run: just release-production
