AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: オタクマッチング LINE アプリ (LIFF + Login + Messaging API)

Parameters:
  LineLoginChannelId:
    Type: String
    Description: LINE Login チャネル ID (ID Token の aud 検証に使用)
  LineChannelAccessToken:
    Type: String
    NoEcho: true
    Description: Messaging API のチャネルアクセストークン
  LineChannelSecret:
    Type: String
    NoEcho: true
    Description: Messaging API のチャネルシークレット (webhook 署名検証)
  LiffId:
    Type: String
    Description: LIFF ID (通知内のリンク生成に使用)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
    Architectures: [arm64]
    Environment:
      Variables:
        TABLE_NAME: !Ref MatchTable
        LINE_LOGIN_CHANNEL_ID: !Ref LineLoginChannelId
        LINE_CHANNEL_ACCESS_TOKEN: !Ref LineChannelAccessToken
        LINE_CHANNEL_SECRET: !Ref LineChannelSecret
        LIFF_ID: !Ref LiffId
        UPLOAD_BUCKET: !Ref UploadBucket
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: "'*'"

Resources:
  # ---------- DynamoDB ----------
  MatchTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
        - {AttributeName: GSI1PK, AttributeType: S}
        - {AttributeName: GSI1SK, AttributeType: S}
        - {AttributeName: GSI2PK, AttributeType: S}
        - {AttributeName: GSI2SK, AttributeType: S}
        - {AttributeName: GSI3PK, AttributeType: S}
        - {AttributeName: GSI3SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - {AttributeName: GSI1PK, KeyType: HASH}
            - {AttributeName: GSI1SK, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
        # 新着フィード（GSI2PK = FEED#<YYYY-MM-DD> で日ごとに分散）
        - IndexName: GSI2
          KeySchema:
            - {AttributeName: GSI2PK, KeyType: HASH}
            - {AttributeName: GSI2SK, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
        # 位置検索（GSI3PK = GEO#<geohash>）
        - IndexName: GSI3
          KeySchema:
            - {AttributeName: GSI3PK, KeyType: HASH}
            - {AttributeName: GSI3SK, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ---------- LIFF からの API ----------
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src
      Handler: app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref MatchTable}
        - S3CrudPolicy: {BucketName: !Ref UploadBucket}
      Events:
        Proxy:
          Type: Api
          Properties: {Path: "/api/{proxy+}", Method: any}

  # ---------- Messaging API webhook ----------
  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src
      Handler: handlers.webhook.lambda_handler
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref MatchTable}
      Events:
        Webhook:
          Type: Api
          Properties: {Path: /line/webhook, Method: post}

  # ---------- トークに送る画像 ----------
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      # 直接は読めない。読み書きとも署名付き URL 経由のみ
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [PUT, GET, HEAD]
            AllowedOrigins: ["*"]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          # メッセージの TTL(180日) に合わせて自動削除
          - Id: ExpireChatImages
            Status: Enabled
            ExpirationInDays: 180

  # ---------- LIFF フロントのホスティング ----------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      # 公開は CloudFront 経由のみ。バケットへの直アクセスは全部塞ぐ
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} LIFF frontend"
        DefaultRootObject: index.html
        PriceClass: PriceClass_200
        HttpVersion: http2
        Origins:
          - Id: FrontendS3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig: {OriginAccessIdentity: ""}
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          # マネージドキャッシュポリシー CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        # SPA のフォールバック。通知リンクは /matches/<id> で開くので、
        # S3 に無いパスは index.html を 200 で返してルーティングを React に任せる
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution.Id}"

Outputs:
  FrontendUrl:
    Description: LIFF のエンドポイント URL に設定する値
    Value: !Sub "https://${FrontendDistribution.DomainName}"
  FrontendBucketName:
    Description: ビルド成果物の同期先バケット
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Description: キャッシュ削除に使うディストリビューション ID
    Value: !Ref FrontendDistribution
  ApiBaseUrl:
    Description: LIFF から叩く API のベース URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/${ServerlessRestApi.Stage}/api"
  WebhookUrl:
    Description: LINE Developers に登録する Webhook URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/${ServerlessRestApi.Stage}/line/webhook"
  TableName:
    Value: !Ref MatchTable
  UploadBucketName:
    Description: トーク画像の保存先
    Value: !Ref UploadBucket
