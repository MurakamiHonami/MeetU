name: CI

on:
  pull_request:
    branches: [dev, main]
  # Populates the node_modules cache on dev. GitHub Actions only lets a PR read
  # caches from its own ref or its base branch, so without this every PR misses
  # and pays a full `npm ci` (~7min).
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # dev → main の PR は skip する。pr-target.yml が main への PR を
    # 「同一リポジトリの dev からのみ」に制限しているため、この diff は
    # 直前の push(dev) 実行の verify で既に検証済み。二重に回すだけ無駄。
    if: github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'main'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - uses: extractions/setup-just@v4

      # Not `just setup`: on a lockfile change the node_modules cache misses and
      # npm ci re-resolves from the network. setup-node has already restored the
      # tarball cache, so prefer it and skip the audit/funding round-trips.
      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: CI checks
        run: just ci
