name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: e3800962ed5e416e565f49c823868cf3
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      VITE_API_BASE_URL: https://api.meetu.ruxel.net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - uses: extractions/setup-just@v2

      - name: Verify deploy secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty. Set it in Settings → Secrets and variables → Actions → Repository secrets (not Environments)."
            exit 1
          fi
          if [ -z "$JWT_SECRET" ]; then
            echo "::error::JWT_SECRET is empty. Set it in Repository secrets."
            exit 1
          fi
          resp=$(curl -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          if [ "$(echo "$resp" | jq -r '.success')" != "true" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is invalid or expired."
            echo "$resp" | jq -r '.errors[]?.message // .messages[]?.message // "verify failed"'
            exit 1
          fi
          echo "Cloudflare API token verified."

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Verify Wrangler account access
        working-directory: backend
        run: npx wrangler whoami

      - name: Sync JWT secret to Worker
        working-directory: backend
        run: printf '%s' "$JWT_SECRET" | npx wrangler secret put JWT_SECRET --env production

      - name: Release to production
        run: just release-production
