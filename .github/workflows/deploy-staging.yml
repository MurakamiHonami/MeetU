name: Deploy Staging

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - uses: extractions/setup-just@v2

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: just setup

      - name: CI checks
        run: just ci

  release:
    needs: verify
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: e3800962ed5e416e565f49c823868cf3
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_PUBLIC_API_BASE_URL: https://api-meetu-staging.ruxel.net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - uses: extractions/setup-just@v2

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: just setup

      - name: Set JWT secret (staging)
        working-directory: backend
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -z "$JWT_SECRET" ]; then
            echo "::error::Add JWT_SECRET to repository secrets (see docs/dev-setup.md)"
            exit 1
          fi
          echo "$JWT_SECRET" | npx wrangler secret put JWT_SECRET --env staging

      - name: Release to staging
        run: just release-staging

      - name: Staging integration tests
        run: just test-staging-integration
